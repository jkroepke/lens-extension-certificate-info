name: Automated biome migrate

# Renovate bumps the Biome version (the biome script in package.json and the
# linter in .trunk/trunk.yaml) but cannot run `biome migrate`, so the schema
# and any renamed rules in biome.jsonc stay behind. This workflow migrates the
# config on the Renovate branch itself, so that the bump and its migration land
# in one pull request instead of a second one against main. The paths are a
# coarse filter: on a branch that does not change the Biome version, the
# migration finds nothing to do.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/biome-migrate.yaml
      - .trunk/trunk.yaml
      - biome.jsonc
      - package.json

permissions:
  contents: read

jobs:
  biome-migrate:
    name: biome migrate

    # Only branches of this repository qualify, never a fork's.
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-24.04-arm
    environment: automated
    timeout-minutes: 10

    env:
      DO_NOT_TRACK: "1"
      MESSAGE: Migrate biome.jsonc to the new Biome version

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: 1248576
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # The Renovate branch is checked out at its head rather than merged with
      # main, so that the migrated config matches the branch it is committed to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The biome script runs Biome with `pnpm dlx`, so no dependency has to be
      # installed.
      - name: Setup pnpm
        run: corepack enable

      - name: Run biome migrate
        run: pnpm biome:migrate

      - name: Check for changes
        run: |-
          if git diff --exit-code --stat -- biome.jsonc; then
            echo "changes=false" | tee -a "$GITHUB_ENV"
          else
            echo "changes=true" | tee -a "$GITHUB_ENV"
          fi

      # A run on a commit this job made must never find the config to migrate
      # again; if it does, committing once more would only loop.
      - name: Refuse to migrate twice
        if: env.changes == 'true'
        run: |-
          if [ "$(git log -1 --format=%s)" = "$MESSAGE" ]; then
            echo "::error::biome.jsonc still needs migrating after it was migrated and committed." >&2
            exit 1
          fi

      # The push uses GH_TOKEN rather than the workflow token, so that it starts
      # the checks again on the migrated config. If the branch moved meanwhile,
      # the push is rejected as non-fast-forward, and the run on the newer
      # commit takes over. The checkout of the head SHA leaves HEAD detached,
      # so the push names the pull request branch; without it git refuses to
      # push ("You are not currently on a branch").
      - name: Commit and push to the pull request branch
        if: env.changes == 'true'
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          default_author: github_actor
          add: biome.jsonc
          message: ${{ env.MESSAGE }}
          push: origin HEAD:refs/heads/${{ github.head_ref }}
